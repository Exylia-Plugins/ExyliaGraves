# Взгляд администрации на чужие могилы на всех серверах. /gravesadmin list <player>
#
# Перезаписывается плагином при каждом запуске: скопируй файл под другим
# именем, если хочешь сохранить своё оформление.
#
# Значения: %owner_name% %owner_id% %graves%
# Каждая могила: %grave_id% %grave_owner% %grave_items% %grave_experience%
#             %grave_server% %grave_world% %grave_x% %grave_y% %grave_z%
#             %grave_age% %grave_time_left% %grave_protection% и
#             %grave_actions% (действия по клику, доступные этому игроку, из messages.yml)

menu-version: 1

title: "{primary}&lМОГИЛЫ {letters_black}» {highlight}%owner_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Больше могил нет"
    lore:
      - "{letters_black}У этого игрока нет могил."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Первая страница"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Последняя страница →"

pagination:
  slots: '0-35'

  item_template:
    material: 'playerhead-%grave_owner%'
    name: "{letters}Могила {letters_black}▸ <gradient:{info}:{info_light}>%grave_world%</gradient>"
    lore:
      - "{letters_black}Могила игрока"
      - ""
      - "{info}✦ Информация"
      - "  {letters_black}· {info}{icon:ping} {letters}Сервер{letters_black}: {info}%grave_server%"
      - "  {letters_black}· {info}{icon:compass} {letters}Где{letters_black}: {info}%grave_x%{letters_black}, {info}%grave_y%{letters_black}, {info}%grave_z%"
      - "  {letters_black}· {info}{icon:diamond} {letters}Предметы{letters_black}: {info}%grave_items%"
      - "  {letters_black}· {info}{icon:xp} {letters}Опыт{letters_black}: {info}%grave_experience%"
      - ""
      - "{info}✦ Состояние"
      - "  {letters_black}· {info}{icon:deaths} {letters}Смерть{letters_black}: {info}%grave_age% назад"
      - "  {letters_black}· {info}{icon:clock} {letters}Истекает через{letters_black}: {info}%grave_time_left%"
      - "  {letters_black}· {info}{icon:key} {letters}Доступ{letters_black}: %grave_protection%"
      - "%grave_actions%"
    actions:
      - "left: exyliagraves:teleport %grave_id%"
      - "right: exyliagraves:preview %grave_id%"
      - "shift_left: exyliagraves:restore %grave_id%"
      - "shift_right: exyliagraves:remove %grave_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Страница {letters_black}▸ <gradient:{error}:{error_light}>← Предыдущая</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Страница {letters_black}▸ <gradient:{success}:{success_light}>Следующая →</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: 'playerhead-%owner_name%'
    name: "<gradient:{primary}:{secondary_light}>%owner_name%</gradient>"
    lore:
      - "{letters_black}Могилы игрока"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Все могилы этого игрока"
      - " {letters}на любом сервере сети."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:iron} {letters}Активных{letters_black}: {info}%graves%"

  restore-all:
    slot: 45
    material: TOTEM_OF_UNDYING
    name: "{letters}Могилы {letters_black}▸ <gradient:{error}:{error_light}>Вернуть все</gradient>"
    condition: "%restore_all%"
    lore:
      - "{letters_black}Опасная зона"
      - ""
      - "{error}✎ Информация"
      - " {letters}Возвращает все могилы игрока"
      - " {highlight}%owner_name% {letters}владельцу, на"
      - " {letters}всех серверах."
      - ""
      - "{error}{icon:click} Нажми, чтобы вернуть все"
      - "{letters_black}Потребуется подтверждение."
    actions:
      - "exyliagraves:restore_all %owner_id% %owner_name%"
