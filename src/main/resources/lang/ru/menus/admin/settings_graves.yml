# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# How long a grave stands, who may open it and how many
# a player may have. Everything else is in config.yml.

title: "{primary}&lНАСТРОЙКИ {letters_black}» {highlight}Могилы"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: SKELETON_SKULL
    name: "<gradient:{primary}:{secondary_light}>Могилы</gradient>"
    lore:
      - "{letters_black}Настройки · Могилы"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Как долго держится могила, кто её"
      - " {letters}откроет и сколько их может быть у"
      - " {letters}игрока."

  graves-expire-time:
    slot: 10
    material: CLOCK
    name: "{letters}Могилы {letters_black}▸ <gradient:{primary}:{secondary_light}>Срок</gradient>"
    lore:
      - "{letters_black}Настройка · Могилы"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Как долго могила держится до"
      - " {letters}конца. {highlight}-1 {letters}хранит её, пока не"
      - " {letters}заберут."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:clock} {letters}Срок{letters_black}: %graves_graves_expire_time%"
      - "  {letters_black}· {info}{icon:book} {letters}По умолчанию{letters_black}: %graves_graves_expire_time_default%"
      - ""
      - "%graves_graves_expire_time_click%"
    actions:
      - "exyliagraves:setting graves graves.expire-time"

  graves-on-expire:
    slot: 11
    material: HOPPER
    name: "{letters}Могилы {letters_black}▸ <gradient:{primary}:{secondary_light}>По истечении</gradient>"
    lore:
      - "{letters_black}Настройка · Могилы"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Что станет с содержимым при"
      - " {letters}истечении: выпадет на месте или"
      - " {letters}удалится."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:hopper} {letters}Затем{letters_black}: %graves_graves_on_expire%"
      - "  {letters_black}· {info}{icon:book} {letters}По умолчанию{letters_black}: %graves_graves_on_expire_default%"
      - ""
      - "%graves_graves_on_expire_click%"
    actions:
      - "exyliagraves:setting graves graves.on-expire"

  graves-protection-time:
    slot: 12
    material: SHIELD
    name: "{letters}Могилы {letters_black}▸ <gradient:{primary}:{secondary_light}>Защита</gradient>"
    lore:
      - "{letters_black}Настройка · Могилы"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Сколько времени её открывает"
      - " {letters}только владелец. {highlight}0 {letters}открыта сразу,"
      - " {letters}{highlight}-1 {letters}только владелец."
