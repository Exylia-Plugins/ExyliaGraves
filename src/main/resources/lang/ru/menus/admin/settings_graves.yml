      - ""
      - "%graves_graves_max_per_player_click%"
    actions:
      - "exyliagraves:setting graves graves.max-per-player"

  graves-disabled-worlds:
    slot: 16
    material: BARRIER
    name: "{letters}Могилы {letters_black}▸ <gradient:{primary}:{secondary_light}>Отключённые миры</gradient>"
    lore:
      - "{letters_black}Настройка · Могилы"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Миры, где могилы не появляются, по"
      - " {letters}имени."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:book} {letters}Миры{letters_black}: %graves_graves_disabled_worlds%"
      - "  {letters_black}· {info}{icon:book} {letters}По умолчанию{letters_black}: %graves_graves_disabled_worlds_default%"
      - ""
      - "%graves_graves_disabled_worlds_click%"
    actions:
