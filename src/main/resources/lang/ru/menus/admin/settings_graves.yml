      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:clock} {letters}Только владелец{letters_black}: %graves_graves_protection_time%"
      - "  {letters_black}· {info}{icon:book} {letters}По умолчанию{letters_black}: %graves_graves_protection_time_default%"
      - ""
      - "%graves_graves_protection_time_click%"
    actions:
      - "exyliagraves:setting graves graves.protection-time"

  graves-killer-can-loot:
