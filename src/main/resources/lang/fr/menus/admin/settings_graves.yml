# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# How long a grave stands, who may open it and how many
# a player may have. Everything else is in config.yml.

title: "{primary}&lRÉGLAGES {letters_black}» {highlight}Tombes"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: SKELETON_SKULL
    name: "<gradient:{primary}:{secondary_light}>Tombes</gradient>"
    lore:
      - "{letters_black}Réglages · Tombes"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Combien de temps une tombe tient,"
      - " {letters}qui peut l'ouvrir et combien un"
      - " {letters}joueur peut en avoir."

  graves-expire-time:
    slot: 10
    material: CLOCK
    name: "{letters}Tombes {letters_black}▸ <gradient:{primary}:{secondary_light}>Durée</gradient>"
    lore:
      - "{letters_black}Réglage · Tombes"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Combien de temps une tombe tient"
      - " {letters}avant la fin. {highlight}-1 {letters}la garde jusqu'à"
      - " {letters}sa récupération."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:clock} {letters}Dure{letters_black}: %graves_graves_expire_time%"
      - "  {letters_black}· {info}{icon:book} {letters}Par défaut{letters_black}: %graves_graves_expire_time_default%"
      - ""
      - "%graves_graves_expire_time_click%"
    actions:
      - "exyliagraves:setting graves graves.expire-time"

  graves-on-expire:
    slot: 11
    material: HOPPER
    name: "{letters}Tombes {letters_black}▸ <gradient:{primary}:{secondary_light}>À l'expiration</gradient>"
    lore:
      - "{letters_black}Réglage · Tombes"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Ce qui arrive au contenu quand la"
      - " {letters}tombe expire : lâché sur place ou"
      - " {letters}supprimé."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:hopper} {letters}Ensuite{letters_black}: %graves_graves_on_expire%"
      - "  {letters_black}· {info}{icon:book} {letters}Par défaut{letters_black}: %graves_graves_on_expire_default%"
      - ""
      - "%graves_graves_on_expire_click%"
    actions:
      - "exyliagraves:setting graves graves.on-expire"

  graves-protection-time:
    slot: 12
    material: SHIELD
    name: "{letters}Tombes {letters_black}▸ <gradient:{primary}:{secondary_light}>Protection</gradient>"
    lore:
      - "{letters_black}Réglage · Tombes"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Combien de temps seul le"
      - " {letters}propriétaire peut l'ouvrir. {highlight}0"
      - " {letters}ouverte aussitôt, {highlight}-1 {letters}propriétaire"
      - " {letters}seul."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:clock} {letters}Propriétaire seul{letters_black}: %graves_graves_protection_time%"
      - "  {letters_black}· {info}{icon:book} {letters}Par défaut{letters_black}: %graves_graves_protection_time_default%"
      - ""
      - "%graves_graves_protection_time_click%"
    actions:
      - "exyliagraves:setting graves graves.protection-time"

  graves-killer-can-loot:
    slot: 14
    material: IRON_SWORD
    name: "{letters}Tombes {letters_black}▸ <gradient:{primary}:{secondary_light}>Butin du tueur</gradient>"
    lore:
