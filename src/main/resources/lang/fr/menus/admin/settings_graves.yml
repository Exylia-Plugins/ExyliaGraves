      - ""
      - "{primary}✎ Informations"
      - " {letters}Mondes où personne n'a de tombe,"
      - " {letters}par nom."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:book} {letters}Mondes{letters_black}: %graves_graves_disabled_worlds%"
      - "  {letters_black}· {info}{icon:book} {letters}Par défaut{letters_black}: %graves_graves_disabled_worlds_default%"
      - ""
      - "%graves_graves_disabled_worlds_click%"
    actions:
