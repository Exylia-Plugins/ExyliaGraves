# Vue du staff sur les tombes de quelqu'un, sur tous les serveurs. /gravesadmin list <player>
#
# Réécrit depuis le plugin à chaque démarrage : copie-le sous un autre nom
# si tu veux garder une personnalisation.
#
# Valeurs : %owner_name% %graves%
# Chaque tombe : %grave_id% %grave_owner% %grave_items% %grave_experience%
#             %grave_server% %grave_world% %grave_x% %grave_y% %grave_z%
#             %grave_age% %grave_time_left% %grave_protection% et
#             %grave_actions% (les actions de clic que ce joueur peut utiliser, depuis messages.yml)

menu-version: 1

title: "{primary}&lTOMBES {letters_black}» {highlight}%owner_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Plus de tombes"
    lore:
      - ""
      - " {letters_black}▎ {letters}Ce joueur n'a aucune tombe sur pied."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: 'playerhead-%grave_owner%'
    name: "{primary}&lTOMBE {letters_black}» {highlight}%grave_world%"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Serveur {letters_black}» {info}%grave_server%"
      - " {letters_black}▎ {letters}Position {letters_black}» {info}%grave_x%{letters_black}, {info}%grave_y%{letters_black}, {info}%grave_z%"
      - " {letters_black}▎ {letters}Objets {letters_black}» {info}%grave_items%"
      - " {letters_black}▎ {letters}Expérience {letters_black}» {info}%grave_experience%"
      - ""
      - "{secondary}Statut :"
      - " {letters_black}▎ {letters}Mort {letters_black}» {info}il y a %grave_age%"
      - " {letters_black}▎ {letters}Expire dans {letters_black}» {info}%grave_time_left% ⌚"
      - " {letters_black}▎ %grave_protection%%grave_actions%"
      - ""
    actions:
      - "left: exyliagraves:teleport %grave_id%"
      - "right: exyliagraves:preview %grave_id%"
      - "shift_left: exyliagraves:restore %grave_id%"
      - "shift_right: exyliagraves:remove %grave_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PAGE PRÉCÉDENTE'
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lPAGE SUIVANTE →'
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: 'playerhead-%owner_name%'
    name: "{primary}&l%owner_name%"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Toutes les tombes sur pied de ce joueur,"
      - " {letters_black}▎ {letters}sur n'importe quel serveur du réseau."
      - ""
      - "{secondary}Statut :"
      - " {letters_black}▎ {letters}Sur pied {letters_black}» {info}%graves%"
      - ""
