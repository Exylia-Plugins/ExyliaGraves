# Your graves on every server of the network. /graves
#
# Yours to restyle: edits are kept across updates. A release that has to
# change the layout raises menu-version below; the file is then replaced
# and your previous one is kept next to it.
#
# Values: %owner_name% %graves%
# Each grave: %grave_id% %grave_owner% %grave_items% %grave_experience%
#             %grave_server% %grave_world% %grave_x% %grave_y% %grave_z%
#             %grave_age% %grave_time_left% %grave_protection% and
#             %grave_actions% (the click prompts this viewer may use, from messages.yml)

menu-version: 3

title: "{primary}&lGRAVES {letters_black}» {highlight}%owner_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more graves"
    lore:
      - "{letters_black}Nothing of yours is lying around."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: 'playerhead-%grave_owner%'
    name: "{letters}Grave {letters_black}▸ <gradient:{info}:{info_light}>%grave_world%</gradient>"
    lore:
      - "{letters_black}Your grave"
      - ""
      - "{info}✦ Information"
      - "  {letters_black}· {info}{icon:ping} {letters}Server{letters_black}: {info}%grave_server%"
      - "  {letters_black}· {info}{icon:compass} {letters}Where{letters_black}: {info}%grave_x%{letters_black}, {info}%grave_y%{letters_black}, {info}%grave_z%"
      - "  {letters_black}· {info}{icon:diamond} {letters}Items{letters_black}: {info}%grave_items%"
      - "  {letters_black}· {info}{icon:xp} {letters}Experience{letters_black}: {info}%grave_experience%"
      - ""
      - "{info}✦ Status"
      - "  {letters_black}· {info}{icon:deaths} {letters}Died{letters_black}: {info}%grave_age% ago"
      - "  {letters_black}· {info}{icon:clock} {letters}Expires in{letters_black}: {info}%grave_time_left%"
      - "  {letters_black}· {info}{icon:key} {letters}Access{letters_black}: %grave_protection%"
      - "%grave_actions%"
    actions:
      - "left: exyliagraves:teleport %grave_id%"
      - "right: exyliagraves:preview %grave_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Previous</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Next →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: 'playerhead-%owner_name%'
    name: "<gradient:{info}:{info_light}>%owner_name%</gradient>"
    lore:
      - "{letters_black}Your graves"
      - ""
      - "{info}✎ Information"
      - " {letters}Walk up to a grave and click the"
      - " {letters}head to get everything back."
      - ""
      - "{info}✦ Status"
      - "  {letters_black}· {info}{icon:iron} {letters}Standing{letters_black}: {info}%graves%"
