      - " {letters}Going back to a grave, its text"
      - " {letters}and the help after respawning."

  teleport-enabled:
    slot: 10
    material: ENDER_PEARL
    name: "{letters}Extras {letters_black}▸ <gradient:{primary}:{secondary_light}>Teleport</gradient>"
    lore:
      - "{letters_black}Extras setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Whether /graves lets a player"
      - " {letters}go back to one of theirs."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}State{letters_black}: %more_teleport_enabled%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %more_teleport_enabled_default%"
