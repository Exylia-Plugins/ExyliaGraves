# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Going back to a grave, the floating text and the respawn help.

title: "{primary}&lSETTINGS {letters_black}» {highlight}Extras"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
