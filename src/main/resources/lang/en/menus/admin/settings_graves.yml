# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# How long a grave stands, who may open it and how many
# a player may have. Everything else is in config.yml.

title: "{primary}&lSETTINGS {letters_black}» {highlight}Graves"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: SKELETON_SKULL
    name: "<gradient:{primary}:{secondary_light}>Graves</gradient>"
    lore:
      - "{letters_black}Graves settings"
      - ""
      - "{primary}✎ Information"
      - " {letters}How long a grave stands, who"
      - " {letters}may open it, and how many a"
      - " {letters}player can have."

  graves-expire-time:
    slot: 10
    material: CLOCK
    name: "{letters}Graves {letters_black}▸ <gradient:{primary}:{secondary_light}>Lifetime</gradient>"
    lore:
      - "{letters_black}Graves setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}How long a grave stands before"
      - " {letters}it is over. {highlight}-1 {letters}keeps it"
      - " {letters}until collected."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Lasts{letters_black}: %graves_graves_expire_time%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %graves_graves_expire_time_default%"
      - ""
      - "%graves_graves_expire_time_click%"
    actions:
      - "exyliagraves:setting graves graves.expire-time"

  graves-on-expire:
    slot: 11
    material: HOPPER
    name: "{letters}Graves {letters_black}▸ <gradient:{primary}:{secondary_light}>On expiry</gradient>"
    lore:
      - "{letters_black}Graves setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}What happens to the contents"
      - " {letters}when a grave expires: dropped"
      - " {letters}where it stood, or deleted."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:hopper} {letters}Then{letters_black}: %graves_graves_on_expire%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %graves_graves_on_expire_default%"
      - ""
      - "%graves_graves_on_expire_click%"
    actions:
      - "exyliagraves:setting graves graves.on-expire"

  graves-protection-time:
    slot: 12
    material: SHIELD
    name: "{letters}Graves {letters_black}▸ <gradient:{primary}:{secondary_light}>Protection</gradient>"
    lore:
      - "{letters_black}Graves setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}How long only the owner may"
      - " {letters}open it. {highlight}0 {letters}is open at once,"
      - " {letters}{highlight}-1 {letters}is owner only."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Owner only{letters_black}: %graves_graves_protection_time%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %graves_graves_protection_time_default%"
      - ""
      - "%graves_graves_protection_time_click%"
    actions:
      - "exyliagraves:setting graves graves.protection-time"

  graves-killer-can-loot:
    slot: 14
    material: IRON_SWORD
    name: "{letters}Graves {letters_black}▸ <gradient:{primary}:{secondary_light}>Killer loot</gradient>"
    lore:
      - "{letters_black}Graves setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Whether the killer may open a"
      - " {letters}grave while it is protected."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}State{letters_black}: %graves_graves_killer_can_loot%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %graves_graves_killer_can_loot_default%"
      - ""
      - "%graves_graves_killer_can_loot_click%"
    actions:
      - "exyliagraves:setting graves graves.killer-can-loot"

  graves-max-per-player:
    slot: 15
    material: CHEST
    name: "{letters}Graves {letters_black}▸ <gradient:{primary}:{secondary_light}>Graves per player</gradient>"
    lore:
      - "{letters_black}Graves setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}How many graves one player may"
      - " {letters}have. The oldest tips out."
      - " {letters}{highlight}-1 {letters}removes the limit."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Limit{letters_black}: %graves_graves_max_per_player%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %graves_graves_max_per_player_default%"
      - ""
      - "%graves_graves_max_per_player_click%"
    actions:
      - "exyliagraves:setting graves graves.max-per-player"

  graves-disabled-worlds:
    slot: 16
    material: BARRIER
    name: "{letters}Graves {letters_black}▸ <gradient:{primary}:{secondary_light}>Disabled worlds</gradient>"
    lore:
      - "{letters_black}Graves setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Worlds where nobody gets a"
      - " {letters}grave, by name."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Worlds{letters_black}: %graves_graves_disabled_worlds%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %graves_graves_disabled_worlds_default%"
      - ""
      - "%graves_graves_disabled_worlds_click%"
    actions:
      - "exyliagraves:setting graves graves.disabled-worlds"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>Settings</gradient>"
    lore:
      - "{error}{icon:click} Click to go back"
    actions:
      - "exyliagraves:settings_hub"
