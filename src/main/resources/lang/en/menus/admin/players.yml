# The staff hub: every player online on this server. /gravesadmin
#
# Rewritten from the plugin on every start: copy it under another name
# if you want to keep a restyle.
#
# Each player: %player_name% %player_id%

menu-version: 1

title: "{primary}&lGRAVES {letters_black}» {highlight}Players {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more players"
    lore:
      - "{letters_black}Nobody else is online on this server."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: 'playerhead-%player_name%'
    name: "{letters}Player {letters_black}▸ <gradient:{info}:{info_light}>%player_name%</gradient>"
    lore:
      - "{letters_black}Online player"
      - ""
      - "{info}✎ Information"
      - " {letters}Every grave this player"
      - " {letters}has standing, on any"
      - " {letters}server of the network."
      - ""
      - "{info}» Click to view their graves"
    actions:
      - "exyliagraves:admin_graves %player_id% %player_name%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Previous</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Next →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  info:
    slot: 49
    material: BOOK
    name: "<gradient:{info}:{info_light}>Players online</gradient>"
    lore:
      - "{letters_black}Overview"
      - ""
      - "{info}✎ Information"
      - " {letters}Players online on this"
      - " {letters}server. For anybody else, use"
      - " {highlight}/gravesadmin list <player>"

  settings:
    slot: 45
    material: COMPARATOR
    name: "{letters}Graves {letters_black}▸ <gradient:{primary}:{secondary_light}>Settings</gradient>"
    lore:
      - "{letters_black}Plugin settings"
      - ""
      - "{primary}✎ Information"
      - " {letters}Change this plugin's settings"
      - " {letters}without editing its {highlight}files{letters}."
      - ""
      - "{primary}» Click {letters_black}· {letters}Open settings"
    actions:
      - "exyliagraves:settings"
