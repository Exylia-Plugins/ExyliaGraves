# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# How long a grave stands, who may open it and how many
# a player may have. Everything else is in config.yml.

title: "{primary}&lDEFINIÇÕES {letters_black}» {highlight}Sepulturas"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: SKELETON_SKULL
    name: "<gradient:{primary}:{secondary_light}>Sepulturas</gradient>"
    lore:
      - "{letters_black}Definições · Sepulturas"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Quanto tempo uma sepultura dura,"
      - " {letters}quem a pode abrir e quantas um"
      - " {letters}jogador pode ter."

  graves-expire-time:
    slot: 10
    material: CLOCK
    name: "{letters}Sepulturas {letters_black}▸ <gradient:{primary}:{secondary_light}>Duração</gradient>"
    lore:
      - "{letters_black}Definição · Sepulturas"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Quanto tempo uma sepultura dura"
      - " {letters}antes de acabar. {highlight}-1 {letters}mantém-na até"
      - " {letters}ser recolhida."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:clock} {letters}Dura{letters_black}: %graves_graves_expire_time%"
      - "  {letters_black}· {info}{icon:book} {letters}Padrão{letters_black}: %graves_graves_expire_time_default%"
