# Visão da staff sobre os túmulos de alguém, em todos os servidores. /gravesadmin list <player>
#
# Reescrito pelo plugin a cada inicialização: copie com outro nome
# se quiser manter uma personalização.
#
# Valores: %owner_name% %owner_id% %graves%
# Cada túmulo: %grave_id% %grave_owner% %grave_items% %grave_experience%
#             %grave_server% %grave_world% %grave_x% %grave_y% %grave_z%
#             %grave_age% %grave_time_left% %grave_protection% e
#             %grave_actions% (as ações de clique que este jogador pode usar, do messages.yml)

menu-version: 1

title: "{primary}&lTÚMULOS {letters_black}» {highlight}%owner_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Não há mais túmulos"
    lore:
      - ""
      - " {letters_black}▎ {letters}Este jogador não tem túmulos ativos."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: 'playerhead-%grave_owner%'
    name: "{primary}&lTÚMULO {letters_black}» {highlight}%grave_world%"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Servidor {letters_black}» {info}%grave_server%"
      - " {letters_black}▎ {letters}Local {letters_black}» {info}%grave_x%{letters_black}, {info}%grave_y%{letters_black}, {info}%grave_z%"
      - " {letters_black}▎ {letters}Itens {letters_black}» {info}%grave_items%"
      - " {letters_black}▎ {letters}Experiência {letters_black}» {info}%grave_experience%"
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Morreu {letters_black}» {info}há %grave_age%"
      - " {letters_black}▎ {letters}Expira em {letters_black}» {info}%grave_time_left% ⌚"
      - " {letters_black}▎ %grave_protection%%grave_actions%"
      - ""
    actions:
      - "left: exyliagraves:teleport %grave_id%"
      - "right: exyliagraves:preview %grave_id%"
      - "shift_left: exyliagraves:restore %grave_id%"
      - "shift_right: exyliagraves:remove %grave_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PÁGINA ANTERIOR'
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lPRÓXIMA PÁGINA →'
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: 'playerhead-%owner_name%'
    name: "{primary}&l%owner_name%"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Todos os túmulos ativos deste jogador,"
      - " {letters_black}▎ {letters}em qualquer servidor da rede."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Ativos {letters_black}» {info}%graves%"
      - ""

  restore-all:
    slot: 45
    material: TOTEM_OF_UNDYING
    name: "{error}&lDEVOLVER TODOS"
    condition: "%restore_all%"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Devolve todos os túmulos de {highlight}%owner_name%"
      - " {letters_black}▎ {letters}ao dono, em todos os servidores."
      - ""
      - "{error}➥ Clique para devolver todos"
      - "{letters_black}Será pedida uma confirmação."
      - ""
    actions:
      - "exyliagraves:restore_all %owner_id% %owner_name%"
