      - "{letters_black}Definições · Conteúdo"
      - ""
      - "{primary}✎ Informação"
      - " {letters}O que uma sepultura guarda:"
      - " {letters}experiência, e que itens ficam de"
      - " {letters}fora."

  contents-experience:
    slot: 11
    material: EXPERIENCE_BOTTLE
    name: "{letters}Conteúdo {letters_black}▸ <gradient:{primary}:{secondary_light}>Experiência</gradient>"
    lore:
      - "{letters_black}Definição · Conteúdo"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Nada, o que o vanilla largaria, ou"
      - " {letters}todos os pontos do jogador."
