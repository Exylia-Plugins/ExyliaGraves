# Yetkili paneli: bu sunucudaki tüm çevrimiçi oyuncular. /gravesadmin
#
# Her başlangıçta eklentiden yeniden yazılır: bir stil değişikliğini korumak
# istiyorsan başka bir adla kopyala.
#
# Her oyuncu: %player_name% %player_id%

menu-version: 1

title: "{primary}&lMEZARLAR {letters_black}» {highlight}Oyuncular {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Başka oyuncu yok"
    lore:
      - "{letters_black}Bu sunucuda başka kimse çevrimiçi değil."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← İlk sayfa"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Son sayfa →"

pagination:
  slots: '0-35'

  item_template:
    material: 'playerhead-%player_name%'
    name: "{letters}Oyuncu {letters_black}▸ <gradient:{info}:{info_light}>%player_name%</gradient>"
    lore:
      - "{letters_black}Çevrimiçi oyuncu"
      - ""
      - "{info}✎ Bilgi"
      - " {letters}Bu oyuncunun duran tüm"
      - " {letters}mezarları, ağdaki her sunucuda."
      - ""
      - "{info}{icon:click} Mezarlarını görmek için tıkla"
    actions:
      - "exyliagraves:admin_graves %player_id% %player_name%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Sayfa {letters_black}▸ <gradient:{error}:{error_light}>← Önceki</gradient>"
      lore:
        - "  {letters_black}· {letters}Sayfa{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Sayfa {letters_black}▸ <gradient:{success}:{success_light}>Sonraki →</gradient>"
      lore:
        - "  {letters_black}· {letters}Sayfa{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  info:
    slot: 49
    material: BOOK
    name: "<gradient:{info}:{info_light}>Çevrimiçi oyuncular</gradient>"
    lore:
      - "{letters_black}Genel bakış"
      - ""
      - "{info}✎ Bilgi"
      - " {letters}Bu sunucudaki çevrimiçi oyuncular."
      - " {letters}Başka biri için şunu kullan:"
      - " {highlight}/gravesadmin list <player>"

  settings:
    slot: 45
    material: COMPARATOR
    name: "{letters}Mezarlar {letters_black}▸ <gradient:{primary}:{secondary_light}>Ayarlar</gradient>"
    lore:
      - "{letters_black}Eklenti ayarları"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Eklentinin ayarlarını"
      - " {highlight}dosyalarını {letters}açmadan değiştirin."
      - ""
      - "{primary}{icon:click} Tık {letters_black}· {letters}Ayarları aç"
    actions:
      - "exyliagraves:settings"
