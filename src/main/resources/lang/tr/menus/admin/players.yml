# Yetkili paneli: bu sunucudaki tüm çevrimiçi oyuncular. /gravesadmin
#
# Her başlangıçta eklentiden yeniden yazılır: bir stil değişikliğini korumak
# istiyorsan başka bir adla kopyala.
#
# Her oyuncu: %player_name% %player_id%

menu-version: 1

title: "{primary}&lMEZARLAR {letters_black}» {highlight}Oyuncular {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Başka oyuncu yok"
    lore:
      - ""
      - " {letters_black}▎ {letters}Bu sunucuda başka kimse çevrimiçi değil."
      - ""
    hide_tooltip: false

