# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Was in ein Grab kommt und was beim Spieler bleibt.

title: "{primary}&lEINSTELLUNGEN {letters_black}» {highlight}Inhalte"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: ENDER_CHEST
    name: "<gradient:{primary}:{secondary_light}>Inhalte</gradient>"
    lore:
      - "{letters_black}Inhalte-Einstellungen"
      - ""
      - "{primary}✎ Information"
      - " {letters}Was ein Grab behält: Erfahrung"
      - " {letters}und welche Items nicht rein kommen."

  contents-experience:
    slot: 11
    material: EXPERIENCE_BOTTLE
    name: "{letters}Inhalte {letters_black}▸ <gradient:{primary}:{secondary_light}>Erfahrung</gradient>"
    lore:
      - "{letters_black}Inhalte-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Keine, was Vanilla droppen würde,"
      - " {letters}oder alle Punkte des Spielers."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Modus{letters_black}: %contents_contents_experience%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %contents_contents_experience_default%"
