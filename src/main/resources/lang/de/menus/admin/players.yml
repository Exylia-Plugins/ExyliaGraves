# Das Staff-Hub: alle Spieler, die auf diesem Server online sind. /gravesadmin
#
# Wird bei jedem Start vom Plugin neu geschrieben: Kopiere die Datei
# unter einem anderen Namen, wenn du dein Design behalten willst.
#
# Pro Spieler: %player_name% %player_id%

menu-version: 1

title: "{primary}&lGRAVES {letters_black}» {highlight}Spieler {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Keine weiteren Spieler"
    lore:
      - "{letters_black}Sonst ist niemand auf diesem Server online."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Erste Seite"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Letzte Seite →"

pagination:
  slots: '0-35'

  item_template:
    material: 'playerhead-%player_name%'
    name: "{letters}Spieler {letters_black}▸ <gradient:{info}:{info_light}>%player_name%</gradient>"
    lore:
      - "{letters_black}Spieler online"
      - ""
      - "{info}✎ Information"
      - " {letters}Alle Gräber dieses Spielers,"
      - " {letters}die noch stehen, auf jedem"
      - " {letters}Server des Netzwerks."
      - ""
      - "{info}{icon:click} Klicke, um seine Gräber zu sehen"
    actions:
      - "exyliagraves:admin_graves %player_id% %player_name%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Seite {letters_black}▸ <gradient:{error}:{error_light}>← Zurück</gradient>"
      lore:
        - "  {letters_black}· {letters}Seite{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Seite {letters_black}▸ <gradient:{success}:{success_light}>Weiter →</gradient>"
      lore:
        - "  {letters_black}· {letters}Seite{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  info:
    slot: 49
    material: BOOK
    name: "<gradient:{info}:{info_light}>Spieler online</gradient>"
    lore:
      - "{letters_black}Übersicht"
      - ""
      - "{info}✎ Information"
      - " {letters}Spieler, die auf diesem"
      - " {letters}Server online sind. Für alle"
      - " {highlight}/gravesadmin list <player>"

  settings:
    slot: 45
    material: COMPARATOR
    name: "{letters}Graves {letters_black}▸ <gradient:{primary}:{secondary_light}>Einstellungen</gradient>"
    lore:
      - "{letters_black}Plugin-Einstellungen"
      - ""
      - "{primary}✎ Information"
      - " {letters}Ändere die Einstellungen dieses"
      - " {letters}Plugins, ohne die {highlight}Dateien{letters} zu bearbeiten."
      - ""
      - "{primary}{icon:click} Klick {letters_black}· {letters}Einstellungen öffnen"
    actions:
      - "exyliagraves:settings"
