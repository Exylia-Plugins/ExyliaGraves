# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Wie lange ein Grab steht, wer es öffnen darf und wie viele
# ein Spieler haben darf. Alles andere steht in der config.yml.

title: "{primary}&lEINSTELLUNGEN {letters_black}» {highlight}Gräber"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: SKELETON_SKULL
    name: "<gradient:{primary}:{secondary_light}>Gräber</gradient>"
    lore:
      - "{letters_black}Gräber-Einstellungen"
      - ""
      - "{primary}✎ Information"
      - " {letters}Wie lange ein Grab steht, wer"
      - " {letters}es öffnen darf und wie viele"
      - " {letters}ein Spieler haben kann."

  graves-expire-time:
    slot: 10
    material: CLOCK
    name: "{letters}Gräber {letters_black}▸ <gradient:{primary}:{secondary_light}>Lebensdauer</gradient>"
    lore:
      - "{letters_black}Gräber-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Wie lange ein Grab steht, bis"
      - " {letters}es abläuft. {highlight}-1 {letters}behält es,"
      - " {letters}bis es geleert wird."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Dauer{letters_black}: %graves_graves_expire_time%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %graves_graves_expire_time_default%"
      - ""
      - "%graves_graves_expire_time_click%"
    actions:
      - "exyliagraves:setting graves graves.expire-time"

  graves-on-expire:
    slot: 11
    material: HOPPER
    name: "{letters}Gräber {letters_black}▸ <gradient:{primary}:{secondary_light}>Beim Ablaufen</gradient>"
    lore:
      - "{letters_black}Gräber-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Was mit dem Inhalt passiert,"
      - " {letters}wenn ein Grab abläuft: am Ort"
      - " {letters}gedroppt oder gelöscht."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:hopper} {letters}Dann{letters_black}: %graves_graves_on_expire%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %graves_graves_on_expire_default%"
      - ""
      - "%graves_graves_on_expire_click%"
    actions:
      - "exyliagraves:setting graves graves.on-expire"

  graves-protection-time:
    slot: 12
    material: SHIELD
    name: "{letters}Gräber {letters_black}▸ <gradient:{primary}:{secondary_light}>Schutz</gradient>"
    lore:
      - "{letters_black}Gräber-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Wie lange nur der Besitzer es"
      - " {letters}öffnen darf. {highlight}0 {letters}ist sofort offen,"
      - " {letters}{highlight}-1 {letters}nur für den Besitzer."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Nur Besitzer{letters_black}: %graves_graves_protection_time%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %graves_graves_protection_time_default%"
      - ""
      - "%graves_graves_protection_time_click%"
    actions:
      - "exyliagraves:setting graves graves.protection-time"

  graves-killer-can-loot:
    slot: 14
    material: IRON_SWORD
    name: "{letters}Gräber {letters_black}▸ <gradient:{primary}:{secondary_light}>Killer-Loot</gradient>"
    lore:
      - "{letters_black}Gräber-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Ob der Killer ein Grab öffnen"
      - " {letters}darf, solange es geschützt ist."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Zustand{letters_black}: %graves_graves_killer_can_loot%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %graves_graves_killer_can_loot_default%"
      - ""
      - "%graves_graves_killer_can_loot_click%"
    actions:
      - "exyliagraves:setting graves graves.killer-can-loot"

  graves-max-per-player:
    slot: 15
    material: CHEST
    name: "{letters}Gräber {letters_black}▸ <gradient:{primary}:{secondary_light}>Gräber pro Spieler</gradient>"
    lore:
      - "{letters_black}Gräber-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Wie viele Gräber ein Spieler"
      - " {letters}haben darf. Das älteste fällt weg."
      - " {letters}{highlight}-1 {letters}hebt das Limit auf."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Limit{letters_black}: %graves_graves_max_per_player%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %graves_graves_max_per_player_default%"
      - ""
      - "%graves_graves_max_per_player_click%"
    actions:
      - "exyliagraves:setting graves graves.max-per-player"

  graves-disabled-worlds:
    slot: 16
    material: BARRIER
    name: "{letters}Gräber {letters_black}▸ <gradient:{primary}:{secondary_light}>Deaktivierte Welten</gradient>"
    lore:
      - "{letters_black}Gräber-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Welten, in denen niemand ein"
      - " {letters}Grab bekommt, nach Name."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Welten{letters_black}: %graves_graves_disabled_worlds%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %graves_graves_disabled_worlds_default%"
      - ""
      - "%graves_graves_disabled_worlds_click%"
    actions:
      - "exyliagraves:setting graves graves.disabled-worlds"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Zurück {letters_black}▸ <gradient:{error}:{error_light}>Einstellungen</gradient>"
    lore:
      - "{error}{icon:click} Klicke, um zurückzugehen"
    actions:
