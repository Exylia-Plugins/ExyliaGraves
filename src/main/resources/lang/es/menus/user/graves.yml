# Tus tumbas en todos los servidores de la red. /graves
#
# Puedes cambiar su estilo: tus cambios se conservan entre actualizaciones.
# Si una versión necesita cambiar el diseño, sube menu-version abajo; el
# archivo se reemplaza y el anterior se guarda a su lado.
#
# Valores: %owner_name% %graves%
# Cada tumba: %grave_id% %grave_owner% %grave_items% %grave_experience%
#             %grave_server% %grave_world% %grave_x% %grave_y% %grave_z%
#             %grave_age% %grave_time_left% %grave_protection% y
#             %grave_actions% (las acciones de clic que este jugador puede usar, de messages.yml)

menu-version: 3

title: "{primary}&lTUMBAS {letters_black}» {highlight}%owner_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No hay más tumbas"
    lore:
      - "{letters_black}No tienes nada tirado por ahí."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: 'playerhead-%grave_owner%'
    name: "{letters}Tumba {letters_black}▸ <gradient:{info}:{info_light}>%grave_world%</gradient>"
    lore:
      - "{letters_black}Tu tumba"
      - ""
      - "{info}✦ Información"
      - "  {letters_black}· {info}{icon:ping} {letters}Servidor{letters_black}: {info}%grave_server%"
      - "  {letters_black}· {info}{icon:compass} {letters}Ubicación{letters_black}: {info}%grave_x%{letters_black}, {info}%grave_y%{letters_black}, {info}%grave_z%"
      - "  {letters_black}· {info}{icon:diamond} {letters}Ítems{letters_black}: {info}%grave_items%"
      - "  {letters_black}· {info}{icon:xp} {letters}Experiencia{letters_black}: {info}%grave_experience%"
      - ""
      - "{info}✦ Estado"
      - "  {letters_black}· {info}{icon:deaths} {letters}Moriste{letters_black}: {info}hace %grave_age%"
      - "  {letters_black}· {info}{icon:clock} {letters}Expira en{letters_black}: {info}%grave_time_left%"
      - "  {letters_black}· {info}{icon:key} {letters}Acceso{letters_black}: %grave_protection%"
      - "%grave_actions%"
    actions:
      - "left: exyliagraves:teleport %grave_id%"
      - "right: exyliagraves:preview %grave_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Siguiente →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: 'playerhead-%owner_name%'
    name: "<gradient:{info}:{info_light}>%owner_name%</gradient>"
    lore:
      - "{letters_black}Tus tumbas"
      - ""
      - "{info}✎ Información"
      - " {letters}Acércate a una tumba y haz clic en"
      - " {letters}la cabeza para recuperarlo todo."
      - ""
      - "{info}✦ Estado"
      - "  {letters_black}· {info}{icon:iron} {letters}En pie{letters_black}: {info}%graves%"
