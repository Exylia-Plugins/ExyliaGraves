      - ""
      - "{primary}✎ Información"
      - " {letters}Mundos donde nadie obtiene tumba,"
      - " {letters}por nombre."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:book} {letters}Mundos{letters_black}: %graves_graves_disabled_worlds%"
      - "  {letters_black}· {info}{icon:book} {letters}Por defecto{letters_black}: %graves_graves_disabled_worlds_default%"
      - ""
      - "%graves_graves_disabled_worlds_click%"
    actions:
      - "exyliagraves:setting graves graves.disabled-worlds"

