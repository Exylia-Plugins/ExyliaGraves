# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# How long a grave stands, who may open it and how many
# a player may have. Everything else is in config.yml.

title: "{primary}&lAJUSTES {letters_black}» {highlight}Tumbas"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: SKELETON_SKULL
    name: "<gradient:{primary}:{secondary_light}>Tumbas</gradient>"
    lore:
      - "{letters_black}Ajustes · Tumbas"
      - ""
      - "{primary}✎ Información"
      - " {letters}Cuánto dura una tumba, quién puede"
      - " {letters}abrirla y cuántas puede tener un"
      - " {letters}jugador."

  graves-expire-time:
    slot: 10
    material: CLOCK
    name: "{letters}Tumbas {letters_black}▸ <gradient:{primary}:{secondary_light}>Duración</gradient>"
    lore:
      - "{letters_black}Ajuste · Tumbas"
      - ""
      - "{primary}✎ Información"
      - " {letters}Cuánto dura una tumba antes de"
      - " {letters}acabar. {highlight}-1 {letters}la mantiene hasta que"
      - " {letters}se recoja."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:clock} {letters}Dura{letters_black}: %graves_graves_expire_time%"
      - "  {letters_black}· {info}{icon:book} {letters}Por defecto{letters_black}: %graves_graves_expire_time_default%"
      - ""
      - "%graves_graves_expire_time_click%"
    actions:
      - "exyliagraves:setting graves graves.expire-time"

  graves-on-expire:
    slot: 11
    material: HOPPER
    name: "{letters}Tumbas {letters_black}▸ <gradient:{primary}:{secondary_light}>Al expirar</gradient>"
    lore:
      - "{letters_black}Ajuste · Tumbas"
      - ""
      - "{primary}✎ Información"
      - " {letters}Qué pasa con el contenido al"
      - " {letters}expirar la tumba: se suelta donde"
      - " {letters}estaba o se borra."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:hopper} {letters}Luego{letters_black}: %graves_graves_on_expire%"
      - "  {letters_black}· {info}{icon:book} {letters}Por defecto{letters_black}: %graves_graves_on_expire_default%"
      - ""
      - "%graves_graves_on_expire_click%"
    actions:
      - "exyliagraves:setting graves graves.on-expire"

  graves-protection-time:
    slot: 12
    material: SHIELD
    name: "{letters}Tumbas {letters_black}▸ <gradient:{primary}:{secondary_light}>Protección</gradient>"
    lore:
      - "{letters_black}Ajuste · Tumbas"
      - ""
      - "{primary}✎ Información"
      - " {letters}Cuánto tiempo solo el dueño puede"
      - " {letters}abrirla. {highlight}0 {letters}es abierta al instante,"
      - " {letters}{highlight}-1 {letters}solo el dueño."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:clock} {letters}Solo dueño{letters_black}: %graves_graves_protection_time%"
      - "  {letters_black}· {info}{icon:book} {letters}Por defecto{letters_black}: %graves_graves_protection_time_default%"
      - ""
      - "%graves_graves_protection_time_click%"
    actions:
      - "exyliagraves:setting graves graves.protection-time"

  graves-killer-can-loot:
    slot: 14
    material: IRON_SWORD
    name: "{letters}Tumbas {letters_black}▸ <gradient:{primary}:{secondary_light}>Botín del asesino</gradient>"
    lore:
