# Vista del staff sobre las tumbas de alguien, en todos los servidores. /gravesadmin list <player>
#
# Se reescribe desde el plugin en cada inicio: cópialo con otro nombre
# si quieres conservar un cambio de estilo.
#
# Valores: %owner_name% %owner_id% %graves%
# Cada tumba: %grave_id% %grave_owner% %grave_items% %grave_experience%
#             %grave_server% %grave_world% %grave_x% %grave_y% %grave_z%
#             %grave_age% %grave_time_left% %grave_protection% y
#             %grave_actions% (las acciones de clic que este jugador puede usar, de messages.yml)

menu-version: 1

title: "{primary}&lTUMBAS {letters_black}» {highlight}%owner_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No hay más tumbas"
    lore:
      - ""
      - " {letters_black}▎ {letters}Este jugador no tiene tumbas en pie."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: 'playerhead-%grave_owner%'
    name: "{primary}&lTUMBA {letters_black}» {highlight}%grave_world%"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Servidor {letters_black}» {info}%grave_server%"
      - " {letters_black}▎ {letters}Ubicación {letters_black}» {info}%grave_x%{letters_black}, {info}%grave_y%{letters_black}, {info}%grave_z%"
      - " {letters_black}▎ {letters}Ítems {letters_black}» {info}%grave_items%"
      - " {letters_black}▎ {letters}Experiencia {letters_black}» {info}%grave_experience%"
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Moriste {letters_black}» {info}hace %grave_age%"
      - " {letters_black}▎ {letters}Expira en {letters_black}» {info}%grave_time_left% ⌚"
      - " {letters_black}▎ %grave_protection%%grave_actions%"
      - ""
    actions:
      - "left: exyliagraves:teleport %grave_id%"
      - "right: exyliagraves:preview %grave_id%"
      - "shift_left: exyliagraves:restore %grave_id%"
      - "shift_right: exyliagraves:remove %grave_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PÁGINA ANTERIOR'
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lPÁGINA SIGUIENTE →'
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: 'playerhead-%owner_name%'
    name: "{primary}&l%owner_name%"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Todas las tumbas en pie de este jugador,"
      - " {letters_black}▎ {letters}en cualquier servidor de la red."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}En pie {letters_black}» {info}%graves%"
      - ""

  restore-all:
    slot: 45
    material: TOTEM_OF_UNDYING
    name: "{error}&lDEVOLVER TODAS"
    condition: "%restore_all%"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Devuelve todas las tumbas de {highlight}%owner_name%"
      - " {letters_black}▎ {letters}a su dueño, en todos los servidores."
      - ""
      - "{error}➥ Clic para devolver todas"
      - "{letters_black}Se te pedirá confirmación."
      - ""
    actions:
      - "exyliagraves:restore_all %owner_id% %owner_name%"
